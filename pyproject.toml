[project]
name = "onnxquant"
version = "0.1.0"
description = "W8A8 static PTQ for ONNX models exported via torch.onnx.export(dynamo=True)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "pydantic>=2.13.4",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "onnxscript>=0.7.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "torch>=2.12.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyrefly]
python-version = "3.11.0"
python-interpreter-path = ".venv/bin/python"
project-includes = ["onnxquant", "tests", "examples"]
infer-with-first-use = false

[tool.pytest.ini_options]
testpaths = ["tests"]

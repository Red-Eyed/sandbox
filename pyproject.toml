[project]
name = "torchquant"
version = "0.1.0"
description = "W8A8 static PTQ via PyTorch 2 Export Quantization (PT2E), exported to ONNX"
readme = "README.md"
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "onnxscript>=0.7.1",
    "pydantic>=2.13.4",
    "torch>=2.12.1",
    "torchao>=0.17.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
examples = [
    "lightning>=2.6.5",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyrefly]
python-version = "3.11.0"
python-interpreter-path = ".venv/bin/python"
project-includes = ["torchquant", "tests", "examples"]
search-path = ["examples/mnist"]
infer-with-first-use = false

[tool.pytest.ini_options]
testpaths = ["tests"]
